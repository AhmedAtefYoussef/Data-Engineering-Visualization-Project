name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The site's packages plus pytest and scipy (the raw-data checks use it); the other notebook-only libraries are not needed for the tests.
      - run: pip install -r requirements.txt pytest scipy
      - run: python -m pytest -q tests
