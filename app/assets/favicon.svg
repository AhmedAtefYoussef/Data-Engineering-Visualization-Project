<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Housing &amp; Streets, NYC</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#fbecc6"/><stop offset="0.4" stop-color="#ecc983"/><stop offset="1" stop-color="#c99a52"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171d33"/><stop offset="1" stop-color="#0b0f1e"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ground)" stroke="#e5bd6f" stroke-opacity="0.55" stroke-width="2"/>
  <!-- the 250 m ring and the crash point inside it -->
  <circle cx="48" cy="16" r="8.5" fill="none" stroke="#ff8f78" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="48" cy="16" r="3.5" fill="#ff8f78"/>
  <!-- buildings that are also a bar chart, on a street -->
  <rect x="13" y="32" width="9" height="18" rx="1.5" fill="url(#gold)"/>
  <rect x="27.5" y="22" width="9" height="28" rx="1.5" fill="url(#gold)"/>
  <rect x="42" y="30" width="9" height="20" rx="1.5" fill="url(#gold)"/>
  <rect x="9" y="50" width="46" height="2" rx="1" fill="#e5bd6f" fill-opacity="0.7"/>
</svg>
