<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Housing &amp; Streets, NYC</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#fbecc6"/><stop offset="0.45" stop-color="#ecc983"/><stop offset="1" stop-color="#c99a52"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171d33"/><stop offset="1" stop-color="#0b0f1e"/></linearGradient>
    <clipPath id="inside"><circle cx="32" cy="32" r="18.6"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ground)" stroke="#e5bd6f" stroke-opacity="0.5" stroke-width="2"/>
  <!-- the 250 m ring the study draws around every building -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <!-- the buildings inside it, standing on a street -->
  <g clip-path="url(#inside)" fill="url(#gold)">
    <rect x="18" y="31" width="7.5" height="13" rx="1"/>
    <rect x="27.5" y="21" width="9" height="23" rx="1"/>
    <rect x="38.5" y="27" width="7.5" height="17" rx="1"/>
  </g>
  <rect x="14" y="43.5" width="36" height="1.2" rx="0.6" fill="#fbecc6" fill-opacity="0.55"/>
  <!-- a crash point on the ring -->
  <circle cx="47" cy="17.2" r="3.4" fill="#ff8f78" stroke="#0f1426" stroke-width="1.4"/>
</svg>
