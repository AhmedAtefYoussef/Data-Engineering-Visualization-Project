[project]
name = "nyc-housing-safety"
version = "1.0.0"
description = "Affordable housing and injury crashes in New York City, 2016 to 2025: notebook and Dash website"
requires-python = ">=3.12"
# Runtime dependencies of the website only (the same list as requirements.txt).
# Pinned, and pyarrow left out: Vercel allows 500 MB of installed packages per Python function (see requirements.txt).
dependencies = [
    "dash==3.4.0",
    "plotly==5.24.1",
    "pandas==2.3.3",
    "numpy==2.5.4",
    "fastparquet==2026.9.0",
]

# Vercel serves the Flask server that Dash creates: the `server` object in app/app.py.
[tool.vercel]
entrypoint = "app.app:server"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# The notebook sections are fragments of one script that share a namespace, so names defined in an
# earlier section look undefined and imports look unused when each file is read alone.
extend-exclude = ["tools/notebook_src", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]          # short lambdas bound to names are used on purpose in the tests

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_covered = true
